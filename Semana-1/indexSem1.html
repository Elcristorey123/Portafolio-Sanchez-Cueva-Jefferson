<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 01 - Formulario con Animación</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 4 Íconos SVG -->
      <div class="icons">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 4h16v16H4z" />
          <path d="M4 9h16" />
          <path d="M9 4v16" />
        </svg>
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2v20" />
          <path d="M2 12h20" />
        </svg>
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"
          />
        </svg>
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" />
        </svg>
      </div>

      <h2>Formulario de Registro</h2>

      <form id="miFormulario">
        <!-- Campo: Nombre -->
        <div class="input-group">
          <input type="text" id="nombre" required />
          <label for="nombre">Nombre</label>
          <div class="underline"></div>
        </div>

        <!-- Campo: Email -->
        <div class="input-group">
          <input type="email" id="email" required />
          <label for="email">Email</label>
          <div class="underline"></div>
        </div>

        <!-- Campo: Teléfono -->
        <div class="input-group">
          <input type="tel" id="telefono" required />
          <label for="telefono">Teléfono</label>
          <div class="underline"></div>
        </div>

        <!-- Checkbox -->
        <div class="checkbox-group">
          <input type="checkbox" id="terminos" />
          <label for="terminos">Acepto los términos y condiciones</label>
        </div>

        <!-- Campo de imagen con Drag & Drop -->
        <div class="drop-zone" id="dropZone">
          <svg
            width="50"
            height="50"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00bcd4"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 15l4-4 4 4 4-4 4 4" />
            <path d="M7 9v.01" />
            <path d="M7 3v3" />
            <path d="M17 3v3" />
            <path d="M3 7h18" />
          </svg>
          <p id="filePath">Arrastra una imagen aquí</p>
        </div>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
        />

        <!-- Botones -->
        <div class="button-group">
          <button type="submit" class="btn-primary">Enviar</button>
          <button type="reset" class="btn-secondary">Limpiar</button>
        </div>
      </form>
    </div>

    <script>
      // ========== ANIMACIÓN DE TEXT FIELDS ==========
      document.querySelectorAll(".input-group input").forEach((input) => {
        // Al hacer clic, activar el estado "focus"
        input.addEventListener("focus", function () {
          this.parentElement.classList.add("focused");
        });

        // Al perder el foco, si está vacío, quitar el estado
        input.addEventListener("blur", function () {
          if (this.value === "") {
            this.parentElement.classList.remove("focused");
          }
        });

        // Si ya tiene texto al cargar, mantener el estado
        if (input.value !== "") {
          input.parentElement.classList.add("focused");
        }
      });

      // ========== DRAG & DROP ==========
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const filePath = document.getElementById("filePath");

      // Prevenir comportamiento por defecto
      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // Resaltar zona cuando se arrastra
      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, () => {
          dropZone.classList.add("highlight");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, () => {
          dropZone.classList.remove("highlight");
        });
      });

      // Soltar archivo
      dropZone.addEventListener("drop", function (e) {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          if (file.type.startsWith("image/")) {
            filePath.textContent = `📁 ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            // Aquí puedes guardar la imagen o procesarla
          } else {
            alert("Por favor, arrastra solo imágenes.");
          }
        }
      });

      // Clic en la zona para abrir selector de archivos
      dropZone.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", function (e) {
        if (this.files.length > 0) {
          const file = this.files[0];
          filePath.textContent = `📁 ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
        }
      });

      // ========== ENVIAR FORMULARIO ==========
      document
        .getElementById("miFormulario")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Formulario enviado correctamente ✅");
        });
    </script>
  </body>
</html>
